name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  pipeline:
    name: Pipeline FULL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Executar pipeline completo
        run: npm run ci:local
        env:
          FORCE_COLOR: "1"
      - name: Relatório de duplicação
        if: ${{ !cancelled() && hashFiles('reports/jscpd/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: duplication-report
          path: reports/jscpd/
          if-no-files-found: error
      - name: Preparar páginas internas
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp dist/index.html dist/404.html
      - name: Enviar site para o Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  pipeline-status:
    name: Resultado do pipeline
    if: ${{ always() }}
    needs: pipeline
    runs-on: ubuntu-latest
    env:
      PIPELINE_RESULT: ${{ needs.pipeline.result }}
    steps:
      - name: Consolidar resultados obrigatórios
        run: |
          echo "Pipeline FULL: $PIPELINE_RESULT"
          if [[ "$PIPELINE_RESULT" != "success" ]]; then
            exit 1
          fi

  deploy:
    name: Publicar no GitHub Pages
    needs: pipeline-status
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
