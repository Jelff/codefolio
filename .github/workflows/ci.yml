name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  pipeline:
    name: Pipeline FULL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Executar pipeline completo
        run: npm run ci:local
        env:
          FORCE_COLOR: "1"
      - name: Relatório de duplicação
        if: ${{ !cancelled() && hashFiles('reports/jscpd/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: duplication-report
          path: reports/jscpd/
          if-no-files-found: error

  pipeline-status:
    name: Resultado do pipeline
    if: ${{ always() }}
    needs: pipeline
    runs-on: ubuntu-latest
    env:
      PIPELINE_RESULT: ${{ needs.pipeline.result }}
    steps:
      - name: Consolidar resultados obrigatórios
        run: |
          echo "Pipeline FULL: $PIPELINE_RESULT"
          if [[ "$PIPELINE_RESULT" != "success" ]]; then
            exit 1
          fi
